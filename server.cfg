# FiveM JCRP Server Configuration

# Server identity
sv_hostname "^3JCRP^7 | Just City Roleplay"
sv_projectName "JCRP Platform"
sv_projectDesc "Database-First Modular FiveM Framework"

# Server settings
sv_maxclients 64
sv_endpointprivacy true

# License key (must be set via environment variable or here)
# sv_licenseKey "YOUR_LICENSE_KEY"

# Database connection (using oxmysql)
set mysql_connection_string "mysql://root:password@localhost/jcrp?charset=utf8mb4"

# Server locale
sets locale "en-US"

# Tags
sets tags "roleplay, economy, jobs, housing"

# Loading screen
load_screen_manual_shutdown "yes"

# Onesync
onesync on

# Script hook & ac
sv_scriptHookAllowed 0
sv_enforceGameBuild 2699

# Resources
ensure oxmysql
ensure ox_lib

# Core resources (P0 - Platform Foundation)
ensure core_boot
ensure core_identity
ensure core_characters
ensure core_state
ensure core_session
ensure core_spawn

# UI resources (P0)
ensure ui_loading

# System resources (P1 - Core Gameplay)
ensure system_money
ensure system_inventory
ensure system_jobs
ensure system_status
ensure system_permissions

# UI resources (P1)
ensure ui_hud

# Lifestyle systems (P2)
ensure system_apartments
ensure system_housing
ensure system_vehicles
ensure system_banking_ui
ensure system_phone

# Admin panel
ensure admin_panel

# Add system admins
add_ace group.admin command allow
add_ace group.admin system.admin allow
add_principal identifier.license:YOUR_LICENSE group.admin
