# ============================================================
# FiveM-JCRP Server Configuration
# ============================================================

# Server identity
sv_hostname "JCRP - FiveM Roleplay"
sv_projectName "JCRP"
sv_projectDesc "Database-first modular FiveM roleplay framework"
sv_maxclients 64
sv_licenseKey ""

# Database (oxmysql)
set mysql_connection_string "mysql://root:password@localhost/jcrp?charset=utf8mb4"

# Framework config
set jcrp_environment "production"
set jcrp_debug "false"

# ============================================================
# Resource startup order — CRITICAL: do not reorder
# ============================================================

# Dependencies
ensure oxmysql
ensure ox_lib

# P0 — Platform Foundation (strict order)
ensure core_boot
ensure core_identity
ensure core_characters
ensure core_state
ensure core_session
ensure core_spawn

# UI
ensure ui_loading
ensure ui_hud

# P1 — Core Gameplay
ensure system_money
ensure system_inventory
ensure system_jobs
ensure system_status
ensure system_permissions

# P2 — Lifestyle (enable when ready)
# ensure system_apartments
# ensure system_housing
# ensure system_vehicles
# ensure system_banking_ui
# ensure system_phone
