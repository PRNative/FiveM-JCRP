# FiveM Platform Foundation - Server Configuration
# JCRP Server

# Database - configure before starting
set mysql_connection_string "mysql://user:password@localhost:3306/fivem_platform?charset=utf8mb4"

sv_hostname "FiveM Platform Foundation"
sv_maxclients 48

# Ensure script hook allows OneSync
onesync on

# Server tags
sv_projectName "FiveM Platform Foundation"
sv_projectDesc "DB-first, modular FiveM platform"

# Steam API (optional - for Steam auth)
# set steam_webApiKey ""

# Server license key (required for public servers)
sv_licenseKey "changeme"

# --------------------------------------------
# CONVARS (config overrides)
# --------------------------------------------
set convar_enableDevelopment false

# --------------------------------------------
# RESOURCE DEPENDENCIES (load order matters)
# --------------------------------------------
ensure oxmysql
ensure ox_lib

# P0 - Platform Foundation (must load first)
ensure core_boot
ensure core_identity
ensure core_characters
ensure core_state
ensure core_spawn
ensure core_session
ensure ui_loading

# P1 - Core Gameplay (load after P0)
ensure system_money
ensure system_inventory
ensure system_jobs
ensure system_status
ensure system_permissions
ensure ui_hud
ensure admin_tools

# P2 - Lifestyle (load after P1)
# ensure system_apartments
# ensure system_housing
# ensure system_vehicles
# ensure system_banking_ui
# ensure system_phone
