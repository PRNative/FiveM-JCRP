<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="spawn-container">
            <div class="spawn-header">
                <h1>Select Spawn Location</h1>
                <p>Choose where you want to spawn</p>
            </div>
            
            <div class="spawn-list" id="spawnList">
                <!-- Spawn options will be dynamically inserted here -->
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
