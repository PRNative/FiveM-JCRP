<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - JCRP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-container">
        <div class="content">
            <div class="logo">
                <h1>JCRP</h1>
                <p class="tagline">Just City Roleplay</p>
            </div>
            
            <div class="loading-info">
                <div class="loading-text" id="loadingText">Connecting to server...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="loading-details" id="loadingDetails">Initializing...</div>
            </div>
            
            <div class="tips">
                <h3>Did you know?</h3>
                <p id="tip">Press F1 to open the help menu once in-game!</p>
            </div>
            
            <div class="footer">
                <p>&copy; 2026 JCRP. All rights reserved.</p>
                <p class="version">Version 1.0.0</p>
            </div>
        </div>
        
        <div class="background-animation">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
